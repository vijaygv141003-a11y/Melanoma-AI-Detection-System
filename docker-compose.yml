version: '3.8'

services:
  web:
    build: .
    container_name: melanoma_ai_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://melanoma_user:melanoma_password@db:5432/melanoma_db
      - SECRET_KEY=your-secret-key-here
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./model:/app/model
      - ./static/uploads:/app/static/uploads
      - ./static/heatmaps:/app/static/heatmaps
      - ./reports:/app/reports
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - melanoma_network

  db:
    image: postgres:13-alpine
    container_name: melanoma_ai_db
    environment:
      - POSTGRES_USER=melanoma_user
      - POSTGRES_PASSWORD=melanoma_password
      - POSTGRES_DB=melanoma_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - melanoma_network

  redis:
    image: redis:7-alpine
    container_name: melanoma_ai_redis
    restart: unless-stopped
    networks:
      - melanoma_network

  nginx:
    image: nginx:alpine
    container_name: melanoma_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - melanoma_network

volumes:
  postgres_data:

networks:
  melanoma_network:
    driver: bridge
